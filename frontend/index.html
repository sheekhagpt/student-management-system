<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <h1>Student Management System</h1>
          <p>
            A full-stack application to add, view, update, and delete student records with a clean and user-friendly interface.
          </p>
        </div>
      </header>

      <main class="container">
        <section class="card form-card">
          <h2 id="formHeading">Add Student</h2>
          <div id="message" class="message-box"></div>
          <form id="studentForm">
            <div class="form-grid">
              <input
                type="text"
                id="name"
                placeholder="Name"
                minlength="2"
                maxlength="50"
                pattern="^[a-zA-Z\s.'-]+$"
                oninput="this.value = this.value.replace(/[^a-zA-Z\s.'-]/g, '').slice(0, 50)"
                title="Name must contain letters only (2 to 50 characters)"
                required
              />
              <input
                type="text"
                id="rollNumber"
                placeholder="Roll Number (1-8 digits)"
                inputmode="numeric"
                pattern="^[1-9][0-9]{0,7}$"
                maxlength="8"
                oninput="this.value = this.value.replace(/\D/g, '').slice(0, 8)"
                title="Roll Number must be a positive number up to 8 digits (e.g. 101)"
                required
              />
              <input
                type="text"
                id="class"
                placeholder="Class (e.g. 10th, Grade 12)"
                minlength="1"
                maxlength="30"
                oninput="this.value = this.value.slice(0, 30)"
                title="Class must be 1 to 30 characters"
                required
              />
              <input
                type="text"
                id="section"
                placeholder="Section / Batch (e.g. A, Morning)"
                minlength="1"
                maxlength="20"
                oninput="this.value = this.value.slice(0, 20)"
                title="Section must be 1 to 20 characters"
                required
              />
              <input
                type="email"
                id="email"
                placeholder="Email (e.g. student@example.com)"
                maxlength="80"
                oninput="this.value = this.value.slice(0, 80)"
                title="Please enter a valid email address"
                required
              />
              <div class="phone-field">
                <select id="countryCode" required>
                  <option value="+91">🇮🇳 +91</option>
                  <option value="+1">🇺🇸 +1</option>
                  <option value="+44">🇬🇧 +44</option>
                  <option value="+61">🇦🇺 +61</option>
                  <option value="+81">🇯🇵 +81</option>
                  <option value="+55">🇧🇷 +55</option>
                  <option value="+49">🇩🇪 +49</option>
                  <option value="+33">🇫🇷 +33</option>
                  <option value="+971">🇦🇪 +971</option>
                  <option value="+966">🇸🇦 +966</option>
                  <option value="+86">🇨🇳 +86</option>
                  <option value="+7">🇷🇺 +7</option>
                </select>
                <input
                  type="tel"
                  id="phone"
                  placeholder="10 digit phone number"
                  inputmode="numeric"
                  pattern="[0-9]{10}"
                  minlength="10"
                  maxlength="10"
                  oninput="this.value = this.value.replace(/\D/g, '').slice(0, 10)"
                  title="Phone number must be exactly 10 digits"
                  required
                />
              </div>
              <input
                type="text"
                id="address"
                placeholder="Address"
                minlength="3"
                maxlength="150"
                oninput="this.value = this.value.slice(0, 150)"
                title="Address must be between 3 and 150 characters"
                required
              />
              <input
                type="date"
                id="dob"
                placeholder="Date of Birth"
                min="1900-01-01"
                required
              />
            </div>
            <div class="form-actions">
              <button id="submitBtn" class="primary-btn" type="submit">
                Add Student
              </button>
              <button
                id="cancelBtn"
                class="cancel-btn"
                type="button"
                style="display: none;"
                onclick="cancelEdit()"
              >
                Cancel
              </button>
            </div>
          </form>
        </section>

        <section class="card list-card">
          <div class="list-header">
            <h2>Students List</h2>
            <span id="studentCount">0 students</span>
          </div>
          <div id="students" class="students-grid"></div>
        </section>
      </main>
    </div>

    <script src="script.js?v=2.0"></script>
  </body>
</html>
